<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOTY</title>
    <link rel="icon" type="image/png" href="favicon.jpg">


  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: black;
      color: white;
      overflow-x: hidden;
    }

    /* FONDO ESTÁTICO PARA IPHONE */
    body.ios-static-bg {
      background: #000 url("material/portada.jpg") center center / cover no-repeat fixed;
    }

    header {
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.8);
      position: relative;
      z-index: 2;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 1rem;
    }

    .video-section {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .video-section.hidden {
      display: none; /* PARA IPHONE */
    }

    video {
      width: 100%;
      height: 100vh;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      z-index: -2;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: -1;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">TOTY</div>
    <nav>
      <a href="catalogo.html">CATÁLOGO</a>
    </nav>
  </header>

  <section class="video-section" id="videoSection">
    <video class="video-fondo" autoplay muted loop playsinline webkit-playsinline>
      <source src="material/video.mp4" type="video/mp4" />
    </video>
    <div class="overlay"></div>
  </section>

  <!-- DETECTAR IPHONE / SAFARI -->
  <script>
    (function() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;

      const isIOS = /iPhone|iPad|iPod/i.test(ua);
      const isSafari = /Safari/i.test(ua) && !/CriOS|FxiOS|OPiOS|EdgiOS/i.test(ua);

      if (isIOS && isSafari) {
        // Fondo estático
        document.body.classList.add('ios-static-bg');

        // Ocultar sección de video COMPLETA
        const vs = document.getElementById("videoSection");
        if (vs) vs.classList.add("hidden");
      }
    })();
  </script>

</body>
</html>
