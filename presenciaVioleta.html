<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Presencia Violeta - TOTY</title>
  <link rel="icon" type="image/png" href="favicon.jpg">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      color: white;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    .video-fondo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      opacity: 70%;
      z-index: -2;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      z-index: -1;
    }

    header {
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1;
      position: relative;
      background-color: black;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: bold;
      letter-spacing: 1px;
      text-decoration: none;
      color: white;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 1rem;
    }

    .detalle {
      padding: 60px 20px;
      text-align: center;
      z-index: 1;
      position: relative;
      min-height: 100vh;
    }

    .detalle h2 {
      font-size: 2rem;
      margin-bottom: 30px;
    }

    /* ====== GALERÍA: FOTO | THUMBS EN MEDIO | VIDEO ====== */
    .galeria-fotos {
      display: flex;
      justify-content: center;
      align-items: flex-start; /* misma línea arriba */
      gap: 18px;
      margin-bottom: 30px;
      flex-wrap: nowrap;
    }

    .foto-principal,
    .galeria-fotos video {
      width: 450px;
      height: 450px;
      max-width: 90vw;
      object-fit: cover;
      background-color: black;
      border-radius: 10px;
      border: 1px solid #333;
      display: block;
    }

    /* Miniaturas al medio (columna) */
    .thumbs {
      height: 450px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 6px 4px;
      overflow-y: auto;
      scrollbar-width: none;
      align-items: center;
      justify-content: center;
    }
    .thumbs::-webkit-scrollbar { display: none; }

    .thumb {
      width: 70px;
      height: 70px;
      border-radius: 12px;
      border: 1px solid #333;
      overflow: hidden;
      cursor: pointer;
      opacity: 0.6;
      transition: 0.18s ease;
      background: rgba(0,0,0,0.25);
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb.activa {
      opacity: 1;
      border-color: #ddd;
      transform: translateY(-1px);
    }

    .detalle p {
      color: #ccc;
      max-width: 600px;
      margin: 0 auto;
      font-size: 1rem;
    }

    .boton-comprar {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-top: 40px;
    }

    /* PRECIO ABAJO DE LA DESCRIPCIÓN */
    .precio-producto {
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin: 14px 0 12px;
    }

    /* LABEL "TALLE" ABAJO DEL PRECIO */
    .label-talle {
      color:#ddd;
      font-size:12px;
      letter-spacing:2px;
      text-transform:uppercase;
      margin-bottom:8px;
      font-weight:300;
      text-align:center;
    }

    /* ====== Responsive ====== */
    @media (max-width: 980px) {
      .galeria-fotos {
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      .thumbs {
        height: auto;
        width: 92vw;
        max-width: 450px;
        flex-direction: row;
        overflow-x: auto;
        overflow-y: hidden;
        justify-content: flex-start;
      }

      .thumb {
        width: 64px;
        height: 64px;
      }
    }

    @media (max-width: 600px) {
      .foto-principal,
      .galeria-fotos video {
        width: 92vw;
        height: 92vw;
        max-height: 420px;
      }
    }
  </style>
</head>

<body>

  <video class="video-fondo" autoplay muted loop playsinline>
    <source src="material/buzo violeta/fondoV.mp4" type="video/mp4" />
    Tu navegador no soporta video.
  </video>

  <div class="overlay"></div>

  <header>
    <a href="index.html" class="logo" id="logoToty">TOTY</a>
    <nav>
      <a href="catalogo.html">VOLVER AL CATÁLOGO</a>
    </nav>
  </header>

  <section class="detalle">
    <h2>PRESENCIA VIOLETA</h2>

    <div class="galeria-fotos">
      <!-- FOTO -->
      <img id="fotoBuzo" class="foto-principal" src="material/buzo violeta/1.jpg" alt="Violeta 1">

      <!-- MINIATURAS EN EL MEDIO -->
      <div class="thumbs" id="thumbs"></div>

      <!-- VIDEO (no lo toco) -->
      <video autoplay muted loop playsinline>
        <source src="material/buzo violeta/video2.MP4" type="video/mp4" />
        Tu navegador no soporta video.
      </video>
    </div>

    <p>
      Buzo violeta cargado de texturas, pensadas para sentirse tanto como para verse. En el frente, una única rosa bordada marca el centro con delicadeza. Una pieza con presencia propia: street con lujo, hecha para destacar sin exagerar.
    </p>

    <!-- PRECIO + TALLE + SHOPIFY -->
    <div class="boton-comprar">
      <!-- CAMBIÁ ESTE PRECIO SI NO ES 3000 -->
      <div class="precio-producto">$3100</div>
      <div class="label-talle">Talle</div>
      <div id="product-component-1763383241123"></div>
    </div>

  </section>

  <!-- MINIATURAS JS (sin flechas) -->
  <script>
    const fotos = [
      "material/buzo violeta/1.jpg",
      "material/buzo violeta/2.jpg",
      "material/buzo violeta/3.jpg",
      "material/buzo violeta/4.jpg"
    ];

    let index = 0;

    const fotoBuzo = document.getElementById("fotoBuzo");
    const thumbs = document.getElementById("thumbs");

    function setFoto(i) {
      index = i;
      fotoBuzo.src = fotos[index];

      [...thumbs.children].forEach((el, idx) => {
        el.classList.toggle("activa", idx === index);
      });
    }

    fotos.forEach((src, i) => {
      const t = document.createElement("div");
      t.className = "thumb" + (i === 0 ? " activa" : "");
      t.innerHTML = `<img src="${src}" alt="thumb ${i + 1}">`;
      t.addEventListener("click", () => setFoto(i));
      thumbs.appendChild(t);
    });

    setFoto(0);
  </script>

  <!-- Shopify Buy Button -->
  <script type="text/javascript">
    (function () {
      var scriptURL = 'https://sdks.shopifycdn.com/buy-button/latest/buy-button-storefront.min.js';

      if (window.ShopifyBuy) {
        if (window.ShopifyBuy.UI) {
          ShopifyBuyInit();
        } else {
          loadScript();
        }
      } else {
        loadScript();
      }

      function loadScript() {
        var script = document.createElement('script');
        script.async = true;
        script.src = scriptURL;
        document.body.appendChild(script);
        script.onload = ShopifyBuyInit;
      }

      function ShopifyBuyInit() {
        var client = ShopifyBuy.buildClient({
          domain: 'tyfukc-4b.myshopify.com',
          storefrontAccessToken: 'a8413ee5dde4253704b93932cee84e2a',
        });

        ShopifyBuy.UI.onReady(client).then(function (ui) {
          ui.createComponent('product', {
            id: '7728752230443',
            node: document.getElementById('product-component-1763383241123'),
            moneyFormat: '%24%7B%7Bamount_with_comma_separator%7D%7D',
            options: {
              product: {
                contents: {
                  img: false,
                  imgWithCarousel: false,
                  title: false,
                  price: false,        /* precio lo mostramos nosotros arriba */
                  description: false,
                  quantity: false,
                  options: true
                },
                styles: {
                  product: {
                    "background-color": "transparent",
                    "text-align": "center",
                    "border": "none",
                    "box-shadow": "none"
                  },
                  button: {
                    "background-color": "#5c1695",
                    "border-radius": "30px",
                    "padding": "12px 24px",
                    "font-weight": "bold",
                    "color": "white",
                    ":hover": { "background-color": "#9c25fd" },
                    ":focus": { "background-color": "#9c25fd" }
                  }
                },
                text: { button: "COMPRAR AHORA" }
              },

              option: {
                styles: {
                  wrapper: {
                    "background-color": "transparent",
                    "border": "none",
                    "box-shadow": "none",
                    "padding": "0",
                    "margin": "0 0 12px 0"
                  },
                  label: {
                    "display": "none" /* oculto label interno: usás tu "Talle" */
                  },
                  select: {
                    "background-color": "#2e2e2e",
                    "border": "1px solid #2e2e2e",
                    "border-radius": "10px",
                    "color": "#fff",
                    "padding": "10px 14px",
                    "font-size": "14px",
                    "text-align": "center",
                    "margin-bottom": "16px",
                    "outline": "none",
                    "appearance": "none",
                    "-webkit-appearance": "none",
                    "-moz-appearance": "none",
                    "box-shadow": "none",
                    "cursor": "pointer",
                    "transition": "0.25s",
                    "width": "100%",
                    ":hover": { "background-color": "#3a3a3a", "border-color": "#3a3a3a" },
                    ":focus": { "background-color": "#3a3a3a", "border-color": "#3a3a3a", "box-shadow": "none", "outline": "none" }
                  }
                }
              },

              cart: {
                styles: {
                  button: {
                    "background-color": "#5c1695",
                    ":hover": { "background-color": "#9c25fd" },
                    ":focus": { "background-color": "#9c25fd" }
                  }
                },
                text: {
                  title: "Carrito",
                  total: "TOTAL",
                  empty: "Tu carrito está vacío",
                  notice: "Vestite como quieras pero que sea TOTY",
                  button: "Comprar"
                }
              },

              toggle: {
                styles: {
                  toggle: {
                    "background-color": "#5c1695",
                    ":hover": { "background-color": "#9c25fd" },
                    ":focus": { "background-color": "#9c25fd" }
                  }
                }
              },

              modalProduct: {
                contents: {
                  img: true,
                  imgWithCarousel: true,
                  button: false,
                  buttonWithQuantity: true,
                  options: true
                },
                styles: {
                  button: {
                    "background-color": "#5c1695",
                    ":hover": { "background-color": "#9c25fd" },
                    ":focus": { "background-color": "#9c25fd" }
                  }
                },
                text: { button: "Agregar al carrito" }
              }
            }
          });
        });
      }
    })();
  </script>

</body>
</html>
