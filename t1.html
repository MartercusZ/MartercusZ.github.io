<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>T1 - TOTY</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      color: white;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      background: #000 url("material/basicos/T1/fondo.jpg") center center / cover no-repeat fixed;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      z-index: -1;
    }

    header {
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: black;
      z-index: 1;
      position: relative;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: bold;
      letter-spacing: 1px;
      text-decoration: none;
      color: white;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 1rem;
    }

    .detalle {
      padding: 60px 20px;
      text-align: center;
      z-index: 1;
      position: relative;
      min-height: 100vh;
    }

    .detalle h2 {
      font-size: 2rem;
      margin-bottom: 30px;
    }

    /* ====== GALERÍA: FOTO | THUMBS EN MEDIO | VIDEO ====== */
    .galeria-fotos {
      display: flex;
      justify-content: center;
      align-items: flex-start; /* misma línea arriba */
      gap: 18px;
      margin-bottom: 30px;
      flex-wrap: nowrap;
    }

    .foto-principal,
    .galeria-fotos video {
      width: 450px;
      height: 450px;
      max-width: 90vw;
      object-fit: cover;
      background-color: transparent;
      border-radius: 10px;
      border: 1px solid #333;
      display: block;
    }

    /* Miniaturas al medio (columna) */
    .thumbs {
      height: 450px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 6px 4px;
      overflow-y: auto;
      scrollbar-width: none;
      align-items: center;
      justify-content: center;
    }
    .thumbs::-webkit-scrollbar { display: none; }

    .thumb {
      width: 70px;
      height: 70px;
      border-radius: 12px;
      border: 1px solid #333;
      overflow: hidden;
      cursor: pointer;
      opacity: 0.6;
      transition: 0.18s ease;
      background: rgba(0,0,0,0.25);
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb.activa {
      opacity: 1;
      border-color: #ddd;
      transform: translateY(-1px);
    }

    /* Placeholder cuando NO hay video aún */
    .video-placeholder {
      width: 450px;
      height: 450px;
      max-width: 90vw;
      border-radius: 10px;
      border: 1px dashed #444;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aaa;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: rgba(0,0,0,0.25);
    }

    .detalle p {
      color: #ccc;
      max-width: 600px;
      margin: 0 auto 18px;
      font-size: 1rem;
      line-height: 1.5;
    }

    .boton-comprar {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
    }

    .precio-producto {
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin: 4px 0 12px;
    }

    .label-talle {
      color:#ddd;
      font-size:12px;
      letter-spacing:2px;
      text-transform:uppercase;
      margin-bottom:8px;
      font-weight:300;
      text-align:center;
    }

    /* ====== Responsive ====== */
    @media (max-width: 980px) {
      .galeria-fotos {
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      .thumbs {
        height: auto;
        width: 92vw;
        max-width: 450px;
        flex-direction: row;
        overflow-x: auto;
        overflow-y: hidden;
        justify-content: flex-start;
      }

      .thumb { width: 64px; height: 64px; }
    }

    @media (max-width: 600px) {
      .foto-principal,
      .galeria-fotos video,
      .video-placeholder {
        width: 92vw;
        height: 92vw;
        max-height: 420px;
      }
    }
  </style>
</head>
<body>

  <div class="overlay"></div>

  <header>
    <a href="index.html" class="logo" id="logoToty">TOTY</a>
    <nav>
      <a href="basicos.html">VOLVER AL CATÁLOGO</a>
    </nav>
  </header>

  <section class="detalle">
    <h2>T1</h2>

    <div class="galeria-fotos">
      <!-- FOTO -->
      <img id="fotoT1" class="foto-principal" src="material/basicos/T1/T1.jpg" alt="T1 1">

      <!-- MINIATURAS EN EL MEDIO -->
      <div class="thumbs" id="thumbs"></div>

      <!-- ✅ VIDEO A LA DERECHA (como en los demás) -->
      <!-- OPCIÓN A: cuando tengas video, descomentá este bloque y poné tu ruta -->
      <!--
      <video autoplay muted loop playsinline webkit-playsinline>
        <source src="material/basicos/T1/video.mp4" type="video/mp4" />
        Tu navegador no soporta video.
      </video>
      -->

      <!-- OPCIÓN B: placeholder mientras NO hay video -->
      <div class="video-placeholder">Video (opcional)</div>
    </div>

    <p>
      T1 – Take Opportunities, Trust Yourself. <br>
      Take = T &nbsp;|&nbsp; Opportunities = O &nbsp;|&nbsp; Trust = T &nbsp;|&nbsp; Yourself = Y. <br>
      Las iniciales forman TOTY: un código de lujo silencioso para quien se anima a apostar por sí mismo.
    </p>

    <div class="boton-comprar">
      <div class="precio-producto">$690</div>
      <div class="label-talle">Talle</div>
      <div id="product-component-1764940674097"></div>
    </div>
  </section>

  <!-- MINIATURAS JS -->
  <script>
    const fotos = [
      "material/basicos/T1/T1.jpg",
      "material/basicos/T1/talles.jpg"
    ];

    let index = 0;

    const fotoT1 = document.getElementById("fotoT1");
    const thumbs = document.getElementById("thumbs");

    function setFoto(i) {
      index = i;
      fotoT1.src = fotos[index];

      [...thumbs.children].forEach((el, idx) => {
        el.classList.toggle("activa", idx === index);
      });
    }

    fotos.forEach((src, i) => {
      const t = document.createElement("div");
      t.className = "thumb" + (i === 0 ? " activa" : "");
      t.innerHTML = `<img src="${src}" alt="thumb ${i + 1}">`;
      t.addEventListener("click", () => setFoto(i));
      thumbs.appendChild(t);
    });

    setFoto(0);
  </script>

  <!-- Shopify Buy Button -->

        });

        ShopifyBuy.UI.onReady(client).then(function (ui) {
          ui.createComponent('product', {
            id: '7752506671147',

            options: {

              cart: {

                  }

              },

          });

      }
    })();
  </script>

</body>
</html>
